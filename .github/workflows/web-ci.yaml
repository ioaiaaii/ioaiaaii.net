name: Web CI/CD

on:
  pull_request:
    paths:
      - 'web/**'
      - 'Makefile'
      - '.github/workflows/web-ci.yaml'
  push:
    branches:
      - master
    paths:
      - 'web/**'
      - 'Makefile'
      - '.github/workflows/web-ci.yaml'

# Least privilege: jobs only read the repo. Deploys authenticate with Cloudflare
# secrets, not GITHUB_TOKEN.
permissions:
  contents: read

# One run per ref; a newer push supersedes an in-flight one.
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: make website-install
      - run: make website-lint-ci
      - run: make website-test
      - run: make website-build

      - name: Upload build output
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: web/dist
          retention-days: 1

  # End-to-end smoke tests: Cypress against the production build, served by vite
  # preview (make website-test-e2e builds, serves and runs cypress/e2e). Runs beside
  # `build`; the preview deploy waits for both.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # npm ci also downloads the Cypress binary (its postinstall).
      - run: make website-install
      - run: make website-test-e2e

      - name: Upload Cypress screenshots
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cypress-screenshots
          path: web/cypress/screenshots
          retention-days: 7
          if-no-files-found: ignore

  # Development delivery: every green master push publishes a Cloudflare Pages
  # PREVIEW (master.ioaiaaii-net.pages.dev). Production is deployed from tags in
  # release.yaml — the project's production branch is "production", so --branch=master
  # is always a preview.
  deliver:
    needs: [build, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download build output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages (development)
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=ioaiaaii-net --branch=master

      # Post-deploy smoke testing is not wired up yet (to be added in a dedicated pass).
