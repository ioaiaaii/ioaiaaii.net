name: Release

on:
  # A version tag cuts a production release. `v[0-9]*` (not `v*`) so a stray
  # non-version tag can't accidentally reach production.
  push:
    tags:
      - 'v[0-9]*'
  # Manual redeploy of a release: run it from a tag. The GitHub production environment
  # only accepts v* tags, so a run from a branch stops at the deploy job. No GitHub Release
  # is created for these.
  workflow_dispatch:

# Default to read-only; the release-notes job elevates to contents: write.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Verify and build the tagged tree. No secrets here: npm install scripts run in this job.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: make website-install
      - run: make website-lint-ci
      - run: make website-test
      - run: make website-build

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: web/dist
          retention-days: 1

  # Production delivery: deploy the build to the Cloudflare Pages production branch.
  # Runs no npm. Its Cloudflare secrets come from the GitHub production environment.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages (production)
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --commit-message just stamps the tag as the deploy's version label in the CF
          # dashboard (cosmetic); --branch=production is what selects the prod environment.
          command: pages deploy dist --project-name=ioaiaaii-net --branch=production --commit-message=${{ github.ref_name }}

  # Only cut the GitHub Release once production is live — never announce a version
  # that did not ship. Tag pushes only: a manual workflow_dispatch has no version tag
  # to release, so it deploys but skips this job.
  release-notes:
    needs: deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # full history for the changelog
          submodules: true      # changelog.mk lives in the repo-operator submodule

      - name: Generate changelog for the tag
        id: generate_changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          changelog=$(make conventional-changelog-release TAG=$TAG)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$changelog" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CHANGELOG: ${{ steps.generate_changelog.outputs.changelog }}
        with:
          script: |
            const tag = process.env.GITHUB_REF_NAME;
            const changelog = process.env.CHANGELOG;
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `${tag}`,
              body: changelog,
              draft: false,
              prerelease: false,
            });
